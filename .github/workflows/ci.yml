name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  protos:
    name: Contratos (buf lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: bufbuild/buf-action@v1
        with:
          input: protos
          lint: true
          format: false
          breaking: false
          push: false
          pr_comment: false

  api:
    name: API (unitários, integração com banco, gRPC, arquitetura)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew check --console=plain

  go:
    name: Go (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [recomendationService, pokemonApiService]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v7
      - name: Verificar se o serviço já tem go.mod
        id: module
        run: |
          if [ -f go.mod ]; then echo "present=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::${{ matrix.service }} ainda não tem go.mod; job ignorado."; fi
      - if: steps.module.outputs.present == 'true'
        uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.service }}/go.mod
          cache-dependency-path: ${{ matrix.service }}/go.sum
      - if: steps.module.outputs.present == 'true'
        run: go test ./...
