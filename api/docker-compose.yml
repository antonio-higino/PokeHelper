services:
  pokemon-api:
    build:
      context: ..
      dockerfile: pokemonApiService/Dockerfile
    ports:
      - "${POKEMON_API_HOST_PORT:-8081}:8081"
      - "${POKEMON_GRPC_HOST_PORT:-50051}:50051"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  recommendation:
    build:
      context: ..
      dockerfile: recomendationService/Dockerfile
    environment:
      POKEMON_API_SERVICE_URL: http://pokemon-api:8081
    depends_on:
      pokemon-api:
        condition: service_healthy
    ports:
      - "${RECOMMENDATION_HOST_PORT:-8082}:8082"
      - "${RECOMMENDATION_GRPC_HOST_PORT:-50052}:50052"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: ..
      dockerfile: api/Dockerfile
    ports:
      - "8080:8080"
    environment:
      PORT: ${PORT:-8080}
      DATABASE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-app_db}
      DATABASE_USER: ${POSTGRES_USER:-admin}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      POKEMON_GRPC_TARGET: pokemon-api:50051
      RECOMMENDATION_GRPC_TARGET: recommendation:50052
      POKEMON_GRPC_TIMEOUT_MS: ${POKEMON_GRPC_TIMEOUT_MS:-2000}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      POSTGRES_DB: ${POSTGRES_DB:-app_db}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-app_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
