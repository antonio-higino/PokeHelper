[tools]
java = "21"
gradle = "9.5.1"

[tasks.build]
description = "Compila os microsserviços Go e gera o artefato Kotlin"
run = ["go -C ../rpc test ./...", "go -C ../pokemonApiService test ./...", "go -C ../recomendationService test ./...", "gradle build -x test"]

[tasks.test]
description = "Sobe as dependências e executa as suítes Go e Kotlin"
run = ["docker compose up -d --wait db", "go -C ../rpc test ./...", "go -C ../pokemonApiService test ./...", "go -C ../recomendationService test ./...", "gradle test"]

[tasks.up]
description = "Sobe a API e o PostgreSQL com Docker Compose"
run = "docker compose up --build"

[tasks.down]
description = "Encerra os serviços do Docker Compose"
run = "docker compose down"
